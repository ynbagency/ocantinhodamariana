name: Bug report
description: Report a reproducible product defect
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes: {label: Problem, description: What happened and what was expected?}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction, description: Exact steps to reproduce}
    validations: {required: true}
  - type: input
    id: commit
    attributes: {label: Commit/build}
  - type: textarea
    id: evidence
    attributes: {label: Evidence, description: Logs/screenshots with secrets and personal data removed}
